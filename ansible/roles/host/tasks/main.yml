- name: Install virtualization packages
  ansible.builtin.apt:
    name: [qemu-kvm, libvirt-daemon-system, libvirt-clients, virtinst, bridge-utils, ovmf, cpu-checker, zram-tools, unattended-upgrades, ufw]
    state: present
    update_cache: true

- name: Enable libvirt
  ansible.builtin.systemd:
    name: libvirtd
    enabled: true
    state: started

- name: Remove the old unrestricted allow rule for the k8s bridge (the ufw module only adds rules)
  community.general.ufw:
    rule: allow
    direction: in
    interface: virbr-k8s
    delete: true

- name: Allow only guest DNS and DHCP into the host from the k8s bridge (guests use static IPs, 10.10.10.1 as resolver)
  community.general.ufw:
    rule: allow
    direction: in
    interface: virbr-k8s
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: "53", proto: tcp }
    - { port: "53", proto: udp }
    - { port: "67", proto: udp }

- name: Allow routed guest traffic out via the host
  community.general.ufw:
    rule: allow
    route: true
    interface_in: virbr-k8s

- name: Allow SSH only
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Enable firewall
  community.general.ufw:
    state: enabled
    policy: deny

- name: Install weekly profile re-evaluation timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop: [vmsetup-detect.service, vmsetup-detect.timer]

- name: Enable re-evaluation timer
  ansible.builtin.systemd:
    name: vmsetup-detect.timer
    enabled: true
    state: started
    daemon_reload: true
