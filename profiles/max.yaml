mgmt_vm: { vcpu: 8, ram_gb: 32, disk_gb: 200 }
clusters: 2
servers_per_cluster: 3
workers_per_cluster: 3
server_vcpu: 2
server_ram_gb: 4
local_llm: { enabled: true, model: "NousResearch/Hermes-4-14B-FP8", engine: vllm }
ai:
  embedding_provider: local
  embedding_model: nomic-embed-text
  vector_memory: true
  phoenix: true
  media: { local: true, local_model_ids: [] }
  training: { enabled: false, max_usd: 100 }
llm_routing: { cloud_budget_usd_month: 100, default_tier: local-large }
monitoring: { scrape_interval: 15s, retention_days: 30, loki: true }
sandbox: incus
parallel_agents: 4
