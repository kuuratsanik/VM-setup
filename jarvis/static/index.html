<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="login" class="panel hidden">
    <h1>Jarvis</h1>
    <p id="login-note" class="muted"></p>
    <form id="login-form">
      <input id="u" placeholder="username" autocomplete="username" required>
      <input id="p" type="password" placeholder="password" autocomplete="current-password" required>
      <input id="c" placeholder="authenticator code (if enabled)" inputmode="numeric" autocomplete="one-time-code">
      <button>Sign in</button>
    </form>
    <p id="login-err" class="err"></p>
  </div>

  <div id="app" class="hidden">
    <header>
      <strong>Jarvis</strong>
      <nav id="tabs"></nav>
      <span id="paused" class="badge bad hidden">agents paused</span>
      <button id="logout" class="link">Sign out</button>
    </header>
    <main>
      <section id="tab-overview"></section>
      <section id="tab-chat" class="hidden">
        <div id="log"></div>
        <form id="chat-form">
          <select id="model"></select>
          <label><input type="checkbox" id="use-tools" checked> tools</label>
          <label><input type="checkbox" id="speak"> speak replies</label>
          <label><input type="checkbox" id="server-voice"> server voice</label>
          <button type="button" id="mic">Mic</button>
          <button type="button" id="img">Image</button>
          <input id="msg" placeholder="Ask Jarvis (never paste keys here; use Setup)" autocomplete="off">
          <button>Send</button>
        </form>
      </section>
      <section id="tab-autonomy" class="hidden"></section>
      <section id="tab-compute" class="hidden"></section>
      <section id="tab-setup" class="hidden"></section>
      <section id="tab-incidents" class="hidden"></section>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
