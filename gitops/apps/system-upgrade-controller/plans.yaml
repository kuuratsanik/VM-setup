apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
  namespace: system-upgrade
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  concurrency: 1
  cordon: true
  serviceAccountName: system-upgrade
  # Explicit version, never a channel. Per-cluster override: clusters/<name>/kustomization.yaml (hub/dev follow the base version below; prod pins its own)
  # To hold prod back: bump this base (dev/hub) first, bump the prod patch last.
  # SUC derives the image tag from this version (rancher/k3s-upgrade:v1.36.5-k3s1).
  version: v1.36.5+k3s1
  nodeSelector:
    matchExpressions:
      - { key: node-role.kubernetes.io/control-plane, operator: Exists }
  upgrade:
    image: rancher/k3s-upgrade
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan
  namespace: system-upgrade
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  concurrency: 1
  cordon: true
  serviceAccountName: system-upgrade
  # Explicit version, never a channel. Per-cluster override: clusters/<name>/kustomization.yaml (hub/dev follow the base version below; prod pins its own)
  # To hold prod back: bump this base (dev/hub) first, bump the prod patch last.
  # SUC derives the image tag from this version (rancher/k3s-upgrade:v1.36.5-k3s1).
  version: v1.36.5+k3s1
  nodeSelector:
    matchExpressions:
      - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
  prepare:
    image: rancher/k3s-upgrade
    args: [prepare, server-plan]
  upgrade:
    image: rancher/k3s-upgrade
