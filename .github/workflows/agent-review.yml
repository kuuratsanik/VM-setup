name: agent-review
# The PR is data, never code: its commits are only diffed. The reviewer that judges it (and holds REVIEWER_API_KEY)
# is the default branch's copy, so a PR cannot rewrite its own judge. Nothing from the PR checkout is executed in this job.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR (data only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      # The default branch, not github.base_ref: an agent can push a branch and aim a PR at it.
      - name: Check out the trusted reviewer from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - run: pip install openai
      - name: Review the PR with the base-branch reviewer
        run: python "$GITHUB_WORKSPACE/trusted/agents/reviewer.py"
        # Diffs run in the trusted checkout: only the PR's commits are fetched in (REVIEW_SOURCE), never its
        # .gitattributes or config.
        working-directory: trusted
        env:
          REVIEW_SOURCE: ${{ github.workspace }}/pr
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          REVIEWER_API_KEY: ${{ secrets.REVIEWER_API_KEY }}
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}
