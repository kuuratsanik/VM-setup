name: auto-merge
# Merges agent PRs that touch only low-risk files (see reviewer.TIER0) after ci and agent-review are green.
# It runs the default-branch copy of the script and never executes PR code.
on:
  workflow_run:
    workflows: [ci, agent-review]
    types: [completed]

permissions:
  contents: read

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Default branch (workflow_run never checks out the PR); full history so the PR head can be diffed against main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - run: python agents/automerge.py --sha ${{ github.event.workflow_run.head_sha }}
        env:
          # Repository variable (Settings > Secrets and variables > Actions > Variables): the GitHub login that
          # agents/pr.py opens PRs as, i.e. the account behind the agent host's `gh auth`. Only PRs authored by it
          # can auto-merge; if it is unset or empty, nothing auto-merges.
          AGENT_PR_AUTHOR: ${{ vars.AGENT_PR_AUTHOR }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
