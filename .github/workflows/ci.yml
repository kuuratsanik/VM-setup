name: ci
on:
  pull_request:
concurrency: ci-${{ github.ref }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform init -backend=false && terraform -chdir=terraform validate
      - run: terraform -chdir=terraform fmt -check
      - run: pip install ansible-lint pyyaml yamllint
      - run: ansible-galaxy collection install -r ansible/requirements.yml
      - run: ansible-lint ansible/
      - run: yamllint -d relaxed profiles agents
      - run: python -m py_compile detect.py agents/*.py infra-mcp/server.py media-mcp/server.py training/*.py scripts/*.py jarvis/*.py jarvis/compute/*.py
      - run: node --check jarvis/static/app.js
      - run: pip install -r agents/requirements.txt -r jarvis/requirements.txt pytest pytest-asyncio && python -m pytest -q tests
      - run: for c in hub dev prod; do kubectl kustomize gitops/clusters/$c > /dev/null; done

  jarvis-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agents/requirements.txt -r jarvis/requirements.txt pytest pytest-asyncio playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/e2e
